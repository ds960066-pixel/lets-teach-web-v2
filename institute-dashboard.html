<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Institute Dashboard | Lets Teach</title>

  <script src="./config.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f4f6fb;
      padding: 20px;
      margin: 0;
    }

    h2 {
      margin-bottom: 10px;
    }

    .actionBar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .btnPrimary {
      background: #2563eb;
      color: #fff;
    }

    .btnPrimary:hover {
      background: #1e4fd8;
    }

    .btnDark {
      background: #111827;
      color: #fff;
    }

    .btnDark:hover {
      background: #000;
    }

    .btnDanger {
      background: #dc2626;
      color: #fff;
    }

    .btnDanger:hover {
      background: #b91c1c;
    }

    .card {
      background: #fff;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .ok {
      background: #e6f9f0;
      color: #15803d;
      padding: 10px;
      border-radius: 6px;
    }

    .warn {
      background: #fff3cd;
      color: #856404;
      padding: 10px;
      border-radius: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin: 6px 0 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .row > div {
      flex: 1;
      min-width: 220px;
    }

    hr {
      margin: 20px 0;
    }
  </style>
</head>

<body>

<script>
if (!localStorage.uid || localStorage.role !== "institute") {
  window.location.href = "login.html";
}
</script>

<h2>Institute Dashboard</h2>

<!-- 🔥 PROFESSIONAL ACTION BUTTONS -->
<div class="actionBar">
  <button class="btn btnPrimary"
    onclick="location.href='institute-applications.html'">
    📄 View Applications
  </button>

  <button class="btn btnPrimary"
    onclick="location.href='chat-list.html'">
    💬 My Chats
  </button>

  <button class="btn btnDark"
    onclick="location.href='institute-my-jobs.html'">
    📌 My Jobs
  </button>

  <button class="btn btnDanger"
    onclick="logout()">
    Logout
  </button>
</div>

<hr>

<div class="card">
  <div class="ok">
    ✅ You can post jobs.
  </div>
</div>

<!-- ================= CREATE JOB ================= -->
<div class="card">
  <h3>Create Job</h3>

  <div class="row">
    <div>
      <label>Job Title *</label>
      <input id="jobTitle" placeholder="e.g. Maths Teacher" />
    </div>
    <div>
      <label>City *</label>
      <input id="jobCity" placeholder="e.g. Delhi" />
    </div>
  </div>

  <div class="row">
    <div>
      <label>Subject *</label>
      <input id="jobSubject" placeholder="e.g. Maths" />
    </div>
    <div>
      <label>Role</label>
      <select id="jobRole">
        <option value="both">Both</option>
        <option value="part-time">Part-time</option>
        <option value="full-time">Full-time</option>
      </select>
    </div>
  </div>

  <label>Salary</label>
  <input id="jobSalary" placeholder="e.g. 15000-25000" />

  <label>Description</label>
  <textarea id="jobDescription"
    placeholder="Timing, requirements..."></textarea>

  <button id="postJobBtn"
    class="btn btnPrimary"
    onclick="postJob()">
    Post Job
  </button>

  <div id="jobResult" style="margin-top:10px;"></div>
</div>

<script>

const uid = localStorage.getItem("uid");

/* ================= LOGOUT ================= */
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

/* ================= POST JOB ================= */
async function postJob() {

  const title = document.getElementById("jobTitle").value.trim();
  const city = document.getElementById("jobCity").value.trim();
  const subject = document.getElementById("jobSubject").value.trim();
  const role = document.getElementById("jobRole").value;
  const salary = document.getElementById("jobSalary").value.trim();
  const description = document.getElementById("jobDescription").value.trim();

  if (!title || !city || !subject) {
    alert("Title, City and Subject required");
    return;
  }

  const btn = document.getElementById("postJobBtn");
  btn.disabled = true;
  btn.innerText = "Posting...";

  try {

    const res = await apiFetch(`${BASE_URL}/api/job/create`, {
      method: "POST",
      body: JSON.stringify({
        instituteUid: uid,
        title,
        subject,
        city,
        role,
        salary,
        description
      })
    });

    if (!res) return;

    const data = await res.json();

    if (!data.success) {
      document.getElementById("jobResult").innerHTML =
        `<div class="warn">${data.message || "Failed"}</div>`;
      return;
    }

    document.getElementById("jobResult").innerHTML =
      `<div class="ok">✅ Job posted successfully</div>`;

    document.getElementById("jobTitle").value = "";
    document.getElementById("jobCity").value = "";
    document.getElementById("jobSubject").value = "";
    document.getElementById("jobSalary").value = "";
    document.getElementById("jobDescription").value = "";

  } catch (e) {
    document.getElementById("jobResult").innerHTML =
      `<div class="warn">Server error</div>`;
  } finally {
    btn.disabled = false;
    btn.innerText = "Post Job";
  }
}

</script>

</body>
</html>
