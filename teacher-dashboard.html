<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher Dashboard | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="./config.js"></script>
</head>

<body>

<!-- AUTH GUARD -->
<script>
  if (!localStorage.uid || localStorage.role !== "teacher") {
    window.location.href = "login.html";
  }
</script>

<!-- NAV -->
<div class="nav">
  <div class="container navInner">
    <a class="brand" href="index.html">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </a>

    <div class="navLinks">
      <a class="pill" href="jobs.html">Jobs</a>
      <a class="pill" href="teacher-applications.html">My Applications</a>
      <a class="pill" href="interview/index.html">Interview Preps</a>
      <a class="pill" href="#" onclick="logout();return false;">Logout</a>
    </div>
  </div>
</div>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="card cardPad">
      <h1 class="hTitle" style="font-size:34px;margin-bottom:8px;">
        Teacher Dashboard
      </h1>
      <p class="hSub">
        Resume complete (details + PDF) hone par hi job apply allow hoga.
      </p>

      <div class="kpis">
        <div class="kpi">
          <b id="resumeBadge">—</b>
          <span>Resume Status</span>
        </div>
        <div class="kpi">
          <b id="inviteBadge">0</b>
          <span>Invites</span>
        </div>
        <div class="kpi">
          <b id="pdfBadge">—</b>
          <span>Resume PDF</span>
        </div>
      </div>

      <!-- 🔥 NEW BUTTON -->
      <div style="margin-top:15px;">
        <button class="btn" onclick="location.href='teacher-applications.html'">
          📄 View My Applied Jobs
        </button>
      </div>

    </div>
  </div>

  <!-- RESUME -->
  <div class="card cardPad">
    <div class="sectionTitle">📄 My Resume</div>
    <div id="resumeStatus" class="meta">Checking resume status…</div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">
      <button class="btn" onclick="openResume()">Create / Update Resume</button>
      <button class="btn" onclick="viewResume()">View Resume</button>
    </div>

    <hr class="sep" />

    <!-- PDF -->
    <div class="sectionTitle">📎 Upload Resume (PDF)</div>
    <div class="searchGrid" style="grid-template-columns:1fr auto;">
      <input class="input" type="file" id="resumeFile" accept="application/pdf" />
      <button class="btn" onclick="uploadResume()">Upload PDF</button>
    </div>
    <div id="uploadStatus" class="meta" style="margin-top:10px;"></div>
  </div>

  <!-- INVITES -->
  <div class="card cardPad" style="margin-top:14px;">
    <div class="sectionTitle">📨 My Invites</div>
    <div id="inviteList" class="list"></div>
  </div>

  <div class="footer">
    <a class="smallLink" href="index.html">Home</a> ·
    <a class="smallLink" href="jobs.html">Jobs</a>
  </div>

</div>

<script>
const uid = localStorage.getItem("uid");

/* LOGOUT */
function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}

/* RESUME NAV */
function openResume() {
  location.href = "teacher-resume-edit.html";
}
function viewResume() {
  location.href = `teacher-resume-view.html?uid=${encodeURIComponent(uid)}`;
}

/* UPLOAD PDF */
async function uploadResume() {
  const file = document.getElementById("resumeFile").files[0];
  const status = document.getElementById("uploadStatus");

  if (!file || file.type !== "application/pdf") {
    alert("Please select a PDF file");
    return;
  }

  status.innerText = "Uploading…";

  const fd = new FormData();
  fd.append("resume", file);

  try {
    const res = await fetch(`${BASE_URL}/api/teacher/upload-resume/${uid}`, {
      method: "POST",
      body: fd
    });
    const data = await res.json();
    status.innerText = data.message || "Uploaded";
    loadResumeStatus();
  } catch {
    status.innerText = "Upload failed";
  }
}

/* RESUME STATUS */
async function loadResumeStatus() {
  try {
    const res = await fetch(`${BASE_URL}/api/teacher/${uid}`);
    const data = await res.json();
    const t = data.teacher;

    const detailsOk =
      !!t.about && !!t.education && Array.isArray(t.skills) && t.skills.length;
    const pdfOk = !!t.resumeUrl;

    document.getElementById("resumeBadge").innerText =
      detailsOk && pdfOk ? "✅ Completed" : "❌ Incomplete";
    document.getElementById("pdfBadge").innerText =
      pdfOk ? "✅ Uploaded" : "❌ Missing";

    document.getElementById("resumeStatus").innerHTML =
      detailsOk && pdfOk
        ? "✅ Resume completed. You can apply for jobs."
        : "❌ Fill resume details + upload PDF.";
  } catch {
    document.getElementById("resumeStatus").innerText = "Error loading resume";
  }
}

/* INVITES */
async function loadInvites() {
  const box = document.getElementById("inviteList");
  box.innerHTML = `<div class="meta">Loading invites…</div>`;

  try {
    const res = await fetch(`${BASE_URL}/api/invite/teacher/${uid}`);
    const data = await res.json();
    const invites = data.invites || [];

    document.getElementById("inviteBadge").innerText = invites.length;

    if (!invites.length) {
      box.innerHTML = `<div class="meta">No invites</div>`;
      return;
    }

    box.innerHTML = "";
    invites.forEach(i => {
      const div = document.createElement("div");
      div.className = "item";

      let action = "";
      if (i.status === "pending") {
        action = `<button class="btn" onclick="acceptInvite('${i._id}')">Accept</button>`;
      } else if (i.status === "accepted") {
        action = `<button class="btn" onclick="openChat('${i.fromUid}')">Chat</button>`;
      } else {
        action = `<span class="badge">${i.status}</span>`;
      }

      div.innerHTML = `
        <div>
          <b>From:</b> ${i.fromUid}<br>
          <span class="meta">Status: ${i.status}</span>
        </div>
        <div>${action}</div>
      `;

      box.appendChild(div);
    });

  } catch {
    box.innerHTML = `<div class="meta">Failed to load invites</div>`;
  }
}

/* INVITE ACTION */
async function acceptInvite(id) {
  await fetch(`${BASE_URL}/api/invite/accept/${id}`, { method: "POST" });
  loadInvites();
  loadResumeStatus();
}

function openChat(otherUid) {
  location.href = `chat.html?senderUid=${uid}&receiverUid=${otherUid}`;
}

/* INIT */
loadResumeStatus();
loadInvites();
</script>

</body>
</html>
