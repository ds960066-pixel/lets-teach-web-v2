<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher Dashboard | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="./config.js"></script>
</head>

<body>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");

if (!token || role !== "teacher") {
  window.location.href = "login.html";
}

/* ===== COMMON AUTH FETCH ===== */
async function apiFetch(url, options = {}) {
  options.headers = {
    ...(options.headers || {}),
    "Authorization": "Bearer " + token
  };

  const res = await fetch(url, options);

  if (res.status === 401) {
    alert("Session expired. Please login again.");
    localStorage.clear();
    window.location.href = "login.html";
    return null;
  }

  return res;
}

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}
</script>

<!-- NAV -->
<div class="nav">
  <div class="container navInner">
    <a class="brand" href="index.html">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </a>

    <div class="navLinks">
      <a class="pill" href="jobs.html">Jobs</a>
      <a class="pill" href="teacher-applications.html">My Applications</a>
      <a class="pill" href="chat-list.html">My Chats</a>
      <a class="pill" href="#" onclick="logout();return false;">Logout</a>
    </div>
  </div>
</div>

<div class="container">

<div class="hero">
  <div class="card cardPad">
    <h1 class="hTitle">Teacher Dashboard</h1>

    <div class="kpis">
      <div class="kpi">
        <b id="resumeBadge">—</b>
        <span>Resume Status</span>
      </div>
      <div class="kpi">
        <b id="inviteBadge">0</b>
        <span>Invites</span>
      </div>
      <div class="kpi">
        <b id="pdfBadge">—</b>
        <span>Resume PDF</span>
      </div>
    </div>
  </div>
</div>

<div class="card cardPad">
  <div class="sectionTitle">📄 My Resume</div>
  <div id="resumeStatus" class="meta">Checking resume status…</div>

  <button class="btn" onclick="location.href='teacher-resume-edit.html'">
    Edit Resume
  </button>

  <hr class="sep">

  <div class="sectionTitle">📎 Upload Resume (PDF)</div>
  <input type="file" id="resumeFile" accept="application/pdf" />
  <button class="btn" onclick="uploadResume()">Upload</button>
  <div id="uploadStatus" class="meta"></div>
</div>

<div class="card cardPad">
  <div class="sectionTitle">📨 My Invites</div>
  <div id="inviteList"></div>
</div>

</div>

<script>

/* ===== LOAD PROFILE ===== */
async function loadProfile() {
  const res = await apiFetch(`${BASE_URL}/api/teacher/me`);
  if (!res) return;

  const data = await res.json();
  const t = data.teacher || {};

  const detailsOk =
    !!t.about && !!t.education &&
    Array.isArray(t.skills) && t.skills.length;

  const pdfOk = !!t.resumeUrl;

  document.getElementById("resumeBadge").innerText =
    detailsOk && pdfOk ? "✅ Completed" : "❌ Incomplete";

  document.getElementById("pdfBadge").innerText =
    pdfOk ? "✅ Uploaded" : "❌ Missing";

  document.getElementById("resumeStatus").innerText =
    detailsOk && pdfOk
      ? "Resume complete"
      : "Complete resume to apply for jobs.";
}

/* ===== UPLOAD RESUME ===== */
async function uploadResume() {
  const file = document.getElementById("resumeFile").files[0];
  if (!file) return alert("Select PDF file");

  const fd = new FormData();
  fd.append("resume", file);

  const res = await fetch(`${BASE_URL}/api/teacher/upload-resume`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token
    },
    body: fd
  });

  if (res.status === 401) {
    alert("Session expired");
    logout();
    return;
  }

  const data = await res.json();
  document.getElementById("uploadStatus").innerText =
    data.message || "Uploaded";

  loadProfile();
}

/* ===== LOAD INVITES ===== */
async function loadInvites() {
  const box = document.getElementById("inviteList");
  box.innerHTML = "Loading...";

  const res = await apiFetch(`${BASE_URL}/api/invite/my`);
  if (!res) return;

  const data = await res.json();
  const invites = data.invites || [];

  document.getElementById("inviteBadge").innerText = invites.length;

  if (!invites.length) {
    box.innerHTML = "No invites.";
    return;
  }

  box.innerHTML = "";

  invites.forEach(invite => {
    const div = document.createElement("div");
    div.innerHTML = `
      <p><b>${invite.otherUserName}</b> - ${invite.status}</p>
      ${invite.status === "accepted"
        ? `<button onclick="openChat('${invite.otherUserId}')">Chat</button>`
        : ""}
    `;
    box.appendChild(div);
  });
}

function openChat(userId) {
  location.href = `chat.html?userId=${userId}`;
}

loadProfile();
loadInvites();

</script>

</body>
</html>
