<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher Resume | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- 🔒 SINGLE SOURCE OF TRUTH -->
  <script src="/lets-teach-web-v2/config.js"></script>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="container navInner">
    <div class="brand">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </div>

    <div class="navLinks">
      <a class="pill" href="index.html">Home</a>
      <a class="pill" href="jobs.html">Jobs</a>
      <a class="pill" href="login.html">Login</a>
    </div>
  </div>
</div>

<div class="container">
  <div class="card cardPad">
    <h2 id="name">Loading…</h2>
    <div class="meta" id="metaLine">Fetching resume…</div>

    <hr class="sep">

    <div class="grid2">

      <!-- LEFT -->
      <div class="card cardPad">
        <div class="sectionTitle">Professional Summary</div>
        <div id="about" class="meta">—</div>

        <hr class="sep">

        <div class="sectionTitle">Education</div>
        <div id="education" class="meta">—</div>

        <hr class="sep">

        <div class="sectionTitle">Resume PDF</div>
        <div id="pdfBox" class="meta">—</div>
      </div>

      <!-- RIGHT -->
      <div class="card cardPad">
        <div class="sectionTitle">Skills</div>
        <div id="skills" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>

        <hr class="sep">

        <button class="btn" onclick="window.print()">Download (Print to PDF)</button>

        <div class="meta" style="margin-top:10px;">
          Tip: Print dialog me “Save as PDF” choose karo.
        </div>
      </div>

    </div>
  </div>

  <div class="footer">
    <span class="meta">Lets Teach · Teacher Resume</span>
  </div>
</div>

<script>
/* ================= UID ================= */
const params = new URLSearchParams(window.location.search);
const uid = params.get("uid") || localStorage.getItem("uid");

if (!uid) {
  alert("Teacher UID missing");
  window.location.href = "login.html";
}

/* ================= HELPERS ================= */
function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function buildFileUrl(path) {
  if (!path) return null;
  if (path.startsWith("http")) return path;
  if (path.startsWith("/")) return `${BASE_URL}${path}`;
  return `${BASE_URL}/${path}`;
}

/* ================= LOAD RESUME ================= */
fetch(`${BASE_URL}/api/teacher/${encodeURIComponent(uid)}`)
  .then(r => r.json())
  .then(data => {
    if (!data.teacher) {
      alert("Teacher not found");
      return;
    }

    const t = data.teacher;

    document.getElementById("name").innerText = escapeHtml(t.name || "Teacher");

    document.getElementById("metaLine").innerHTML = `
      <span class="badge">
        ${escapeHtml(t.subject || "—")} · ${escapeHtml(t.city || "—")} · ${Number(t.experience || 0)} yrs
      </span>
      <div class="meta" style="margin-top:8px;">
        <b>Phone:</b> ${escapeHtml(t.phone || "—")}
      </div>
    `;

    document.getElementById("about").innerText = t.about || "—";
    document.getElementById("education").innerText = t.education || "—";

    /* ===== SKILLS ===== */
    const skillsBox = document.getElementById("skills");
    skillsBox.innerHTML = "";

    if (Array.isArray(t.skills) && t.skills.length) {
      t.skills.forEach(s => {
        const tag = document.createElement("span");
        tag.className = "badge";
        tag.innerText = s;
        skillsBox.appendChild(tag);
      });
    } else {
      skillsBox.innerHTML = `<div class="meta">—</div>`;
    }

    /* ===== PDF ===== */
    const pdfBox = document.getElementById("pdfBox");
    const pdfPath = t.resume?.pdfUrl || t.resumeUrl;
    const pdfUrl = buildFileUrl(pdfPath);

    if (!pdfUrl) {
      pdfBox.innerHTML = `❌ <b>Not uploaded</b>`;
      return;
    }

    pdfBox.innerHTML = `
      ✅ <b>Uploaded</b><br><br>
      <a class="smallLink" href="${pdfUrl}" target="_blank">View PDF</a>
      &nbsp; · &nbsp;
      <a class="smallLink" href="${pdfUrl}" download>Download PDF</a>
    `;
  })
  .catch(err => {
    console.error(err);
    alert("Server error");
  });
</script>

</body>
</html>
