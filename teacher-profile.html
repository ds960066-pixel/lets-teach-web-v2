<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teacher Profile | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- 🔒 SINGLE SOURCE OF TRUTH -->
  <script src="./config.js"></script>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="container navInner">
    <div class="brand">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </div>

    <div class="navLinks">
      <a class="pill" href="index.html">Home</a>
      <a class="pill" href="jobs.html">Jobs</a>
      <a class="pill" href="login.html">Login</a>
    </div>
  </div>
</div>

<div class="container">

  <div class="card cardPad" style="max-width:780px;margin:0 auto;">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <div>
        <h1 id="name" style="margin:0 0 6px;">Loading…</h1>
        <div class="meta" id="info">Fetching teacher details…</div>
      </div>
      <span class="badge" id="badge">Teacher</span>
    </div>

    <hr class="sep" />

    <div class="grid2">
      <div class="kpi"><b>Subject</b><span id="subject">—</span></div>
      <div class="kpi"><b>City</b><span id="city">—</span></div>
    </div>

    <div class="kpis">
      <div class="kpi"><b>Experience</b><span id="exp">—</span></div>
      <div class="kpi"><b>Role</b><span id="role">—</span></div>
      <div class="kpi"><b>UID</b><span id="uidShow">—</span></div>
    </div>

    <hr class="sep" />

    <!-- Institute Actions -->
    <div id="actionsBox" class="kpi" style="display:none;">
      <b>Actions (Institute only)</b>
      <span style="display:block;margin-top:6px;">
        Invite bhejo ya chat start karo.
      </span>

      <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn" onclick="invite()">Send Invite</button>
        <button class="btn" onclick="chat()">Open Chat</button>
        <a class="pill" href="index.html">Back</a>
      </div>
    </div>

    <!-- Login Hint -->
    <div id="loginHint" class="kpi" style="display:none;">
      <b>Want to invite or chat?</b>
      <span style="display:block;margin-top:6px;">
        Please login as an <b>Institute</b>.
      </span>
      <div style="margin-top:10px;">
        <a class="pill" href="login.html">Login</a>
      </div>
    </div>

  </div>

  <div class="footer">
    <a href="privacy.html">Privacy</a> ·
    <a href="interview/index.html">Interview Preps</a>
  </div>

</div>

<script>
const myUid  = localStorage.getItem("uid");
const myRole = localStorage.getItem("role"); // institute | teacher

const teacherUid = new URLSearchParams(location.search).get("uid");
if (!teacherUid) location.href = "index.html";

/* SHOW ACTIONS */
if (myUid && myRole === "institute") {
  actionsBox.style.display = "block";
} else {
  loginHint.style.display = "block";
}

/* LOAD TEACHER */
fetch(`${BASE_URL}/api/teacher/${encodeURIComponent(teacherUid)}`)
  .then(r => r.json())
  .then(d => {
    const t = d.teacher;
    if (!t) {
      alert("Teacher not found");
      location.href = "index.html";
      return;
    }

    name.innerText = t.name || "Teacher";
    info.innerText = `${t.subject || "—"} · ${t.city || "—"} · ${Number(t.experience || 0)} yrs`;

    subject.innerText = t.subject || "—";
    city.innerText    = t.city || "—";
    exp.innerText     = `${Number(t.experience || 0)} yrs`;
    role.innerText    = t.role || "both";
    uidShow.innerText = t.uid || teacherUid;

    if (t.verificationStatus === "verified") {
      badge.innerText = "Verified Teacher";
    }
  })
  .catch(() => alert("Server error loading teacher"));

/* INVITE */
function invite() {
  fetch(`${BASE_URL}/api/invite/create`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      fromType: "institute",
      fromUid: myUid,
      toType: "teacher",
      toUid: teacherUid
    })
  })
  .then(r => r.json())
  .then(d => alert(d.message || "Invite sent"));
}

/* CHAT */
function chat() {
  location.href =
    `chat.html?senderUid=${encodeURIComponent(myUid)}&receiverUid=${encodeURIComponent(teacherUid)}`;
}
</script>

</body>
</html>
