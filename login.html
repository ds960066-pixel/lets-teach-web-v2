<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Lets Teach</title>

  <script src="./config.js"></script>
</head>

<body>

<h2>Login</h2>

<input id="email" type="email" placeholder="Email" />
<br><br>

<input id="password" type="password" placeholder="Password" />
<br><br>

<button onclick="login('teacher')">Login as Teacher</button>
<button onclick="login('institute')">Login as Institute</button>

<script>

function getFormData() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Email and Password required");
    return null;
  }

  return { email, password };
}

async function login(role) {

  const form = getFormData();
  if (!form) return;

  const url =
    role === "teacher"
      ? `${BASE_URL}/api/teacher/login`
      : `${BASE_URL}/api/institute/login`;

  try {

    const res = await fetch(url,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(form)
    });

    const data = await res.json();

    if(!data.success){
      alert(data.message || "Login failed");
      return;
    }

    localStorage.setItem("token", data.token);
    localStorage.setItem("role", role);

    if(role === "teacher" && data.teacher){
      localStorage.setItem("teacherId", data.teacher._id);
    }

    if(role === "institute" && data.institute){
      localStorage.setItem("instituteId", data.institute._id);
    }

    window.location.href =
      role === "teacher"
        ? "teacher-dashboard.html"
        : "institute-dashboard.html";

  } catch(err){
    console.error("Login error:", err);
    alert("Server error");
  }

}

</script>

</body>
</html>
