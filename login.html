<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Lets Teach</title>

  <!-- ✅ CSS -->
  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ CONFIG -->
  <script src="./config.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f4f6fb;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 15px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btnTeacher {
      background: #2563eb;
      color: #fff;
    }

    .btnInstitute {
      background: #16a34a;
      color: #fff;
    }

    .btnTeacher:hover { background: #1e4fd8; }
    .btnInstitute:hover { background: #12863c; }

  </style>
</head>

<body>

<div class="container">
  <h2>Login</h2>

  <input id="email" type="email" placeholder="Enter Email" />
  <input id="password" type="password" placeholder="Enter Password" />

  <button class="btnTeacher" onclick="login('teacher')">
    Login as Teacher
  </button>

  <button class="btnInstitute" onclick="login('institute')">
    Login as Institute
  </button>
</div>

<script>

function getFormData() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Email and Password required");
    return null;
  }

  return { email, password };
}

async function login(role) {

  const form = getFormData();
  if (!form) return;

  const url =
    role === "teacher"
      ? `${BASE_URL}/api/teacher/login`
      : `${BASE_URL}/api/institute/login`;

  try {

    const res = await fetch(url,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(form)
    });

    const data = await res.json();

    console.log("LOGIN RESPONSE:", data);
alert(JSON.stringify(data));

    if(!data.success){
      alert(data.message || "Login failed");
      return;
    }

    /* ===== SAVE ===== */

    localStorage.setItem("token", data.token);
    localStorage.setItem("role", role);

    if(role === "teacher"){
      if(data.teacher && data.teacher._id){
        localStorage.setItem("teacherId", data.teacher._id);
      } else {
        alert("Teacher data missing");
        return;
      }
    }

    if(role === "institute"){
      if(data.institute && data.institute._id){
        localStorage.setItem("instituteId", data.institute._id);
      } else {
        alert("Institute data missing");
        return;
      }
    }

    /* ===== REDIRECT ===== */

    window.location.href =
      role === "teacher"
        ? "teacher-dashboard.html"
        : "institute-dashboard.html";

  } catch(err){
    console.error("Login error:", err);
    alert("Server error");
  }

}

</script>

</body>
</html>
