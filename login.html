<script>

function getFormData() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Email and Password required");
    return null;
  }

  return { email, password };
}

async function login(role) {

  const form = getFormData();
  if (!form) return;

  const url =
    role === "teacher"
      ? `${BASE_URL}/api/teacher/login`
      : `${BASE_URL}/api/institute/login`;

  try {

    const res = await fetch(url,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        email: form.email,
        password: form.password
      })
    });

    const data = await res.json();

    if(!data.success){
      alert(data.message || "Login failed");
      return;
    }

    /* ===== SAVE LOGIN DATA ===== */

    localStorage.setItem("token", data.token);
    localStorage.setItem("role", role);

    // ✅ TEACHER LOGIN
    if(role === "teacher" && data.teacher){
      localStorage.setItem("teacherId", data.teacher._id);
    }

    // ✅ INSTITUTE LOGIN (IMPORTANT FIX)
    if(role === "institute" && data.institute){
      localStorage.setItem("instituteId", data.institute._id);
    }

    /* ===== REDIRECT ===== */

    if(role === "teacher"){
      window.location.href = "teacher-dashboard.html";
    }else{
      window.location.href = "institute-dashboard.html";
    }

  } catch(err){
    console.error("Login error:", err);
    alert("Server error");
  }

}

</script>
