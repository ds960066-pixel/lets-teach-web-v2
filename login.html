<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Lets Teach</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<div class="nav">
  <div class="container navInner">
    <a class="brand" href="index.html">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </a>
  </div>
</div>

<div class="container">
  <div class="hero">
    <div class="card cardPad">
      <h1 class="hTitle">Login</h1>

      <div class="sectionTitle">Your UID</div>
      <input class="input" id="uid" placeholder="Enter UID" />

      <div style="margin-top:15px; display:flex; gap:10px;">
        <button class="btn" onclick="loginTeacher()">Login as Teacher</button>
        <button class="btn" onclick="loginInstitute()">Login as Institute</button>
      </div>
    </div>
  </div>
</div>

<script src="./config.js"></script>

<script>
function getUid() {
  const uid = document.getElementById("uid").value.trim();
  if (!uid) {
    alert("Please enter UID");
    return null;
  }
  return uid;
}

/* ================= MAIN LOGIN FUNCTION ================= */
async function handleLogin(role) {
  const uid = getUid();
  if (!uid) return;

  const loginUrl =
    role === "teacher"
      ? `${BASE_URL}/api/teacher/login`
      : `${BASE_URL}/api/institute/login`;

  try {
    const res = await fetch(loginUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uid })
    });

    const data = await res.json();

    /* ================= IF USER NOT FOUND → AUTO REGISTER ================= */
    if (!data.success && data.message === "Teacher not found" && role === "teacher") {

      // Minimal auto register
      await fetch(`${BASE_URL}/api/teacher/create`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          uid,
          name: "New Teacher",
          phone: "0000000000",
          subject: "General",
          city: "Unknown",
          experience: "0"
        })
      });

      // Try login again
      return handleLogin(role);
    }

    if (!data.success && data.message === "Institute not found" && role === "institute") {

      await fetch(`${BASE_URL}/api/institute/create`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          uid,
          name: "New Institute",
          phone: "0000000000",
          city: "Unknown"
        })
      });

      return handleLogin(role);
    }

    if (!data.success) {
      alert(data.message || "Login failed");
      return;
    }

    /* ================= STORE TOKEN ================= */
    localStorage.setItem("token", data.token);
    localStorage.setItem("uid", uid);
    localStorage.setItem("role", role);

    /* ================= REDIRECT ================= */
    window.location.href =
      role === "teacher"
        ? "teacher-dashboard.html"
        : "institute-dashboard.html";

  } catch (err) {
    console.error(err);
    alert("Server error");
  }
}

function loginTeacher() {
  handleLogin("teacher");
}

function loginInstitute() {
  handleLogin("institute");
}
</script>

</body>
</html>
