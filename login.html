<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="./config.js"></script>
</head>

<body>

<div class="nav">
  <div class="container navInner">
    <a class="brand" href="index.html">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </a>
  </div>
</div>

<div class="container">
  <div class="hero">
    <div class="heroGrid">

      <div class="card cardPad">
        <h1 class="hTitle">Login</h1>
        <p class="hSub">Enter your Email and Password</p>

        <div class="sectionTitle">Email</div>
        <input class="input" id="email" type="email" placeholder="Enter Email" />

        <div class="sectionTitle" style="margin-top:10px;">Password</div>
        <input class="input" id="password" type="password" placeholder="Enter Password" />

        <div style="display:flex; gap:10px; margin-top:15px;">
          <button class="btn" onclick="login('teacher')">Login as Teacher</button>
          <button class="btn" onclick="login('institute')">Login as Institute</button>
        </div>

        <p class="meta" style="margin-top:10px;">
          Don’t have an account?
          <a href="teacher-register.html">Register as Teacher</a> |
          <a href="institute-register.html">Register as Institute</a>
        </p>
      </div>

    </div>
  </div>
</div>

<script>

function getFormData() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) {
    alert("Email and Password required");
    return null;
  }

  return { email, password };
}

async function login(role) {

  const form = getFormData();
  if (!form) return;

  const url =
    role === "teacher"
      ? `${BASE_URL}/api/teacher/login`
      : `${BASE_URL}/api/institute/login`;

  try {

    const res = await fetch(url,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        email: form.email,
        password: form.password
      })
    });

    const data = await res.json();

    if(!data.success){
      alert(data.message || "Login failed");
      return;
    }

    /* ===== SAVE LOGIN DATA ===== */

    localStorage.setItem("token", data.token);
    localStorage.setItem("role", role);

    if(data.uid){
      localStorage.setItem("uid", data.uid);
    }

    /* ===== REDIRECT ===== */

    if(role === "teacher"){
      window.location.href = "teacher-dashboard.html";
    }else{
      window.location.href = "institute-dashboard.html";
    }

  } catch(err){
    console.error("Login error:", err);
    alert("Server error");
  }

}

</script>

</body>
</html>
