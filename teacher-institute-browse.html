<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Institutes | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- 🔒 SINGLE SOURCE OF TRUTH -->
  <script src="/lets-teach-web-v2/config.js"></script>"/lets-teach-web-v2/config.js"></script>
</head>

<body>

<!-- AUTH GUARD -->
<script>
  if (!localStorage.uid || localStorage.role !== "teacher") {
    window.location.href = "login.html";
  }
</script>

<!-- NAV -->
<div class="nav">
  <div class="container navInner">
    <div class="brand">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </div>

    <div class="navLinks">
      <a class="pill" href="teacher-dashboard.html">Dashboard</a>
      <a class="pill" href="jobs.html">Jobs</a>
      <a class="pill" href="login.html">Logout</a>
    </div>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1 class="hTitle">Browse Institutes</h1>
    <p class="hSub">
      City ke basis par institutes dekho aur invite bhejo.
    </p>
  </div>

  <div class="card cardPad">
    <div class="sectionTitle">Search</div>

    <div class="searchGrid">
      <input class="input" id="city" placeholder="City (optional)" />
      <button class="btn" onclick="loadInstitutes()">Search</button>
    </div>

    <p class="meta" style="margin-top:10px;">
      Tip: City blank chhodoge to sab institutes dikh jayenge.
    </p>
  </div>

  <div style="height:14px;"></div>

  <div class="card cardPad">
    <div class="sectionTitle">Institutes</div>
    <hr class="sep" />

    <div id="list" class="list"></div>
    <div id="hint" class="meta" style="margin-top:12px;"></div>
  </div>

  <div class="footer">
    <span class="meta">Lets Teach · Browse Institutes</span>
  </div>

</div>

<script>
const teacherUid = localStorage.getItem("uid");

function setHint(msg) {
  document.getElementById("hint").innerHTML = msg || "";
}

/* ================= LOAD INSTITUTES ================= */
function loadInstitutes() {
  const city = document.getElementById("city").value.trim();
  const box = document.getElementById("list");

  let url = `${BASE_URL}/api/institute/browse`;
  if (city) url += `?city=${encodeURIComponent(city)}`;

  box.innerHTML = `<div class="meta">Loading institutes...</div>`;
  setHint("");

  fetch(url)
    .then(res => res.json())
    .then(data => {
      box.innerHTML = "";

      const list = data.institutes || [];

      if (!list.length) {
        box.innerHTML = `<div class="meta">No institutes found</div>`;
        return;
      }

      list.forEach(i => {
        const div = document.createElement("div");
        div.className = "item";

        let action = "";

        if (i.isRegistered || i.registered) {
          action = `
            <button class="btn" onclick="sendInvite('${i.uid}')">
              Send Invite
            </button>
          `;
        } else {
          action = `
            <div class="badge" style="opacity:.8;">
              Not registered · Phone: ${i.phone || "N/A"}
            </div>
          `;
        }

        div.innerHTML = `
          <div style="flex:1;">
            <div style="font-weight:800;">${i.name}</div>
            <div class="meta">
              ${i.city || "—"} · ${(i.subjectsNeeded || []).join(", ") || "—"}
            </div>
            <div style="margin-top:10px;">
              ${action}
            </div>
          </div>
          <div class="badge">Institute</div>
        `;

        box.appendChild(div);
      });
    })
    .catch(() => {
      box.innerHTML = `<div class="meta">Server error loading institutes</div>`;
    });
}

/* ================= SEND INVITE ================= */
function sendInvite(instituteUid) {
  fetch(`${BASE_URL}/api/invite/create`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      fromType: "teacher",
      fromUid: teacherUid,
      toType: "institute",
      toUid: instituteUid
    })
  })
  .then(res => res.json())
  .then(data => alert(data.message || "Invite sent"))
  .catch(() => alert("Server error"));
}

/* INIT */
loadInstitutes();
</script>

</body>
</html>
