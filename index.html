<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lets Teach | Find Teachers & Institutes</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="container navInner">
    <div class="brand">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </div>

    <div class="navLinks">
      <a class="pill" href="jobs.html">Jobs</a>
      <a class="pill" href="interview/index.html">Interview Preps</a>
      <a class="pill" href="login.html">Login</a>
    </div>
  </div>
</div>

<div class="container">

  <!-- SEARCH -->
  <div class="hero heroCard">
    <h1>Find Teachers & Institutes</h1>

    <div class="searchRow">
      <input id="city" placeholder="City" />
      <input id="subject" placeholder="Subject" />
      <button class="btn" onclick="applyFilter()">Search</button>
      <button class="btn ghost" onclick="clearFilter()">Clear</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="grid2">

    <!-- TEACHERS -->
    <div class="card">
      <div class="cardHead">
        <h2>Teachers</h2>
        <span id="teacherCount" class="badge">0</span>
      </div>
      <div id="teachers" class="list"></div>
    </div>

    <!-- INSTITUTES -->
    <div class="card">
      <div class="cardHead">
        <h2>Institutes</h2>
        <span id="instituteCount" class="badge">0</span>
      </div>
      <div id="institutes" class="list"></div>
    </div>

  </div>

</div>

<!-- CONFIG -->
<script src="./config.js"></script>

<script>
/* ================= FILTER ================= */
function applyFilter() {
  loadTeachers(
    document.getElementById("city").value.trim(),
    document.getElementById("subject").value.trim()
  );
  loadInstitutes(document.getElementById("city").value.trim());
}

function clearFilter() {
  document.getElementById("city").value = "";
  document.getElementById("subject").value = "";
  loadTeachers();
  loadInstitutes();
}

/* ================= LOAD TEACHERS ================= */
function loadTeachers(city = "", subject = "") {
  let url = `${BASE_URL}/api/teachers`;
  const q = [];
  if (city) q.push(`city=${encodeURIComponent(city)}`);
  if (subject) q.push(`subject=${encodeURIComponent(subject)}`);
  if (q.length) url += `?${q.join("&")}`;

  const box = document.getElementById("teachers");
  box.innerHTML = "Loading...";

  fetch(url)
    .then(r => r.json())
    .then(d => {
      const list = d.teachers || [];
      document.getElementById("teacherCount").innerText = list.length;

      if (!list.length) {
        box.innerHTML = "No teachers found";
        return;
      }

      box.innerHTML = "";
      list.forEach(t => {
        box.innerHTML += `
          <div class="item">
            <b>${t.name}</b><br>
            ${t.subject} · ${t.city}<br>
            <a href="teacher-public.html?uid=${t.uid}">View Profile</a>
          </div>
        `;
      });
    })
    .catch(() => {
      box.innerHTML = "Error loading teachers";
    });
}

/* ================= LOAD INSTITUTES ================= */
function loadInstitutes(city = "") {
  let url = `${BASE_URL}/api/institutes`;
  if (city) url += `?city=${encodeURIComponent(city)}`;

  const box = document.getElementById("institutes");
  box.innerHTML = "Loading...";

  fetch(url)
    .then(r => r.json())
    .then(d => {
      const list = d.institutes || [];
      document.getElementById("instituteCount").innerText = list.length;

      if (!list.length) {
        box.innerHTML = "No institutes found";
        return;
      }

      box.innerHTML = "";
      list.forEach(i => {
        box.innerHTML += `
          <div class="item">
            <b>${i.name}</b><br>
            ${i.city}<br>
            <a href="institute-public.html?uid=${i.uid}">View Profile</a>
          </div>
        `;
      });
    })
    .catch(() => {
      box.innerHTML = "Error loading institutes";
    });
}

/* ================= INIT ================= */
loadTeachers();
loadInstitutes();
</script>

</body>
</html>
