<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Received Applications | Lets Teach</title>
  <link rel="stylesheet" href="styles.css">
  <script src="./config.js"></script>
</head>

<body>

<div class="container">
  <h2>Received Applications</h2>
  <button onclick="location.href='institute-dashboard.html'">⬅ Back</button>
  <hr>
  <div id="box">Loading...</div>
</div>

<script>
const uid = localStorage.getItem("uid");
const role = localStorage.getItem("role");

if (!uid || role !== "institute") {
  alert("Login as Institute");
  window.location.href = "login.html";
}

async function loadApps() {
  try {
    const res = await fetch(`${BASE_URL}/api/job-application/institute/${uid}`);
    const data = await res.json();

    const box = document.getElementById("box");
    box.innerHTML = "";

    if (!data.success || !data.applications || data.applications.length === 0) {
      box.innerHTML = "<p>No applications received yet.</p>";
      return;
    }

    data.applications.forEach(app => {

      const t = app.teacher;
      const job = app.jobId;

      const div = document.createElement("div");
      div.style.background = "#fff";
      div.style.padding = "15px";
      div.style.marginBottom = "15px";
      div.style.border = "1px solid #ddd";
      div.style.borderRadius = "8px";

      const resumeLink = t && t.resumeUrl
        ? `${BASE_URL}${t.resumeUrl.startsWith("/") ? "" : "/"}${t.resumeUrl}`
        : null;

      div.innerHTML = `
        <h3>${job ? job.title : "Job"}</h3>
        <p><b>Subject:</b> ${job ? job.subject : "-"}</p>
        <p><b>City:</b> ${job ? job.city : "-"}</p>
        <hr>
        <p><b>Teacher Name:</b> ${t ? t.name : app.teacherUid}</p>
        <p><b>City:</b> ${t ? t.city : "-"}</p>
        <p><b>Subject:</b> ${t ? t.subject : "-"}</p>
        <p><b>Status:</b> ${app.status || "applied"}</p>
        <br>
        ${
          resumeLink
          ? `<a href="${resumeLink}" target="_blank">👁 View Resume PDF</a>
             &nbsp; | &nbsp;
             <a href="${resumeLink}" download>⬇ Download</a>`
          : `<span style="color:red;">❌ Resume PDF not uploaded</span>`
        }
      `;

      box.appendChild(div);
    });

  } catch (err) {
    document.getElementById("box").innerHTML = "<p>Server error</p>";
  }
}

loadApps();
</script>

</body>
</html>
