<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Institute Registration | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="./config.js"></script>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <div class="container navInner">
    <a class="brand" href="index.html">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </a>

    <div class="navLinks">
      <a class="pill" href="index.html">Home</a>
      <a class="pill" href="jobs.html">Jobs</a>
      <a class="pill" href="login.html">Login</a>
    </div>
  </div>
</div>

<div class="container">

<div class="card cardPad" style="max-width:760px;margin:0 auto;">
  <h1 style="margin:0 0 8px;">Institute Registration</h1>
  <p class="meta">Create your institute account.</p>

  <hr class="sep" />

  <div class="searchGrid">
    <input class="input" id="name" placeholder="Institute Name" />
    <input class="input" id="email" type="email" placeholder="Email" />
  </div>

  <div style="height:10px;"></div>

  <div class="searchGrid">
    <input class="input" id="password" type="password" placeholder="Password (min 6 chars)" />
    <input class="input" id="phone" placeholder="Phone" />
  </div>

  <div style="height:10px;"></div>

  <div class="searchGrid">
    <input class="input" id="city" placeholder="City" />
    <input class="input" id="address" placeholder="Address" />
    <input class="input" id="subjectsNeeded" placeholder="Subjects Needed (comma separated)" />
  </div>

  <div style="margin-top:15px;">
    <button class="btn" onclick="registerInstitute()">Create Account</button>
  </div>

  <div id="msg" class="meta" style="margin-top:12px;"></div>
</div>

</div>

<script>
function setMsg(text) {
  document.getElementById("msg").innerText = text || "";
}

async function registerInstitute() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const city = document.getElementById("city").value.trim();
  const address = document.getElementById("address").value.trim();
  const subjectsRaw = document.getElementById("subjectsNeeded").value.trim();

  if (!name || !email || !password || !phone || !city) {
    alert("All required fields must be filled");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return;
  }

  const subjectsNeeded = subjectsRaw
    ? subjectsRaw.split(",").map(s => s.trim())
    : [];

  setMsg("Creating account...");

  try {
    const res = await fetch(`${BASE_URL}/api/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        role: "institute",
        name,
        email,
        password
      })
    });

    const data = await res.json();

    if (!data.success) {
      setMsg("");
      alert(data.message || "Registration failed");
      return;
    }

    setMsg("Account created successfully! Redirecting...");
    setTimeout(() => {
      window.location.href = "login.html";
    }, 1000);

  } catch (err) {
    console.error(err);
    setMsg("");
    alert("Server error");
  }
}
</script>

</body>
</html>
