<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8" />

  <title>
    My Applied Jobs | Lets Teach
  </title>

  <script src="./config.js"></script>

  <style>

    body{
      font-family: Arial;
      background:#f4f4f4;
      padding:20px;
      margin:0;
    }

    .card{
      background:#fff;
      padding:15px;
      margin-bottom:12px;
      border-radius:6px;
    }

    .badge{
      padding:4px 8px;
      border-radius:4px;
      font-size:12px;
      font-weight:bold;
    }

    .applied{
      background:#e3f2fd;
      color:#1565c0;
    }

    .shortlisted{
      background:#e8f5e9;
      color:#2e7d32;
    }

    .rejected{
      background:#ffebee;
      color:#c62828;
    }

    button{
      padding:6px 12px;
      background:#2e86de;
      color:#fff;
      border:none;
      border-radius:4px;
      cursor:pointer;
    }

  </style>

</head>

<body>

<script>

/* ================= AUTH ================= */

const teacherId =
  localStorage.getItem("teacherId");

const token =
  localStorage.getItem("token");

const role =
  localStorage.getItem("role");

if (!teacherId || !token || role !== "teacher") {

  window.location.href = "login.html";
}

/* ================= API FETCH ================= */

async function apiFetch(url, options = {}) {

  options.headers = {
    ...(options.headers || {}),
    Authorization: `Bearer ${token}`
  };

  try {

    const res = await fetch(url, options);

    if (res.status === 401) {

      alert("Session expired");

      localStorage.clear();

      window.location.href = "login.html";

      return null;
    }

    return res;

  } catch (err) {

    console.error(err);

    return null;
  }
}

</script>

<h2>My Applied Jobs</h2>

<button
  onclick="location.href='teacher-dashboard.html'"
>
  Back
</button>

<hr>

<div id="box">
  Loading...
</div>

<script>

/* ================= LOAD APPLICATIONS ================= */

async function loadApplications() {

  const box =
    document.getElementById("box");

  box.innerHTML = "Loading...";

  try {

    const res = await apiFetch(
      `${BASE_URL}/api/job-application/teacher/${teacherId}`
    );

    if (!res) return;

    const data = await res.json();

    box.innerHTML = "";

    if (
      !data.success ||
      !data.applications ||
      data.applications.length === 0
    ) {

      box.innerHTML =
        "<p>No applications yet.</p>";

      return;
    }

    data.applications.forEach(app => {

      const job =
        app.jobId || {};

      const statusClass =
        app.status || "applied";

      const div =
        document.createElement("div");

      div.className = "card";

      div.innerHTML = `

        <b>Job:</b>
        ${job.title || "-"}
        <br>

        <b>Subject:</b>
        ${job.subject || "-"}
        <br>

        <b>City:</b>
        ${job.city || "-"}
        <br>

        <b>Role:</b>
        ${job.role || "-"}
        <br>

        <b>Applied On:</b>
        ${new Date(app.createdAt)
          .toLocaleDateString()}
        <br><br>

        <span class="badge ${statusClass}">
          ${app.status.toUpperCase()}
        </span>

      `;

      box.appendChild(div);

    });

  } catch (err) {

    console.error(err);

    box.innerHTML = "Server error";

  }
}

/* ================= INIT ================= */

loadApplications();

</script>

</body>
</html>
