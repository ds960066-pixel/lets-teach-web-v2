<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Institute Dashboard | Lets Teach</title>
<script src="./config.js"></script>

<style>
body{font-family:Arial;background:#f4f4f4;padding:20px;margin:0}
.wrap{max-width:1100px;margin:auto}
.card{background:#fff;padding:15px;margin:12px 0;border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.06)}
button{padding:8px 12px;background:#2e86de;color:#fff;border:none;
border-radius:8px;font-weight:600;cursor:pointer}
button:hover{filter:brightness(.95)}
.btnDanger{background:#dc2626}
.btnGhost{background:transparent;color:#2e86de;border:1px solid rgba(46,134,222,.4)}
input,textarea,select{padding:10px;border-radius:8px;border:1px solid #ddd;width:100%}
textarea{min-height:90px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.badge{padding:4px 8px;border-radius:999px;font-size:12px}
.open{background:#e8f5e9;color:#2e7d32}
.closed{background:#ffebee;color:#c62828}
.section{margin-top:20px}
</style>
</head>

<body>
<div class="wrap">

<script>
if(!localStorage.uid || localStorage.role!=="institute"){
  window.location.href="login.html";
}
</script>

<h2>Institute Dashboard</h2>
<button onclick="logout()">Logout</button>

<div class="section card">
<h3>Create Job</h3>

<input id="title" placeholder="Job Title" />
<input id="subject" placeholder="Subject" />
<input id="city" placeholder="City" />

<select id="role">
<option value="both">Both</option>
<option value="part-time">Part-time</option>
<option value="full-time">Full-time</option>
</select>

<input id="salary" placeholder="Salary" />
<textarea id="description" placeholder="Description"></textarea>

<br><br>
<button onclick="createJob()">Create Job</button>
<div id="jobMsg"></div>
</div>

<div class="section card">
<h3>My Jobs</h3>
<div id="jobsBox">Loading...</div>
</div>

<div class="section card">
<h3>Browse Teachers</h3>
<button onclick="loadTeachers()">Load Teachers</button>
<div id="teachersBox"></div>
</div>

<div class="section card">
<h3>Received Applications</h3>
<button onclick="loadApplications()">Refresh</button>
<div id="applicationsBox"></div>
</div>

</div>

<script>

const uid = localStorage.getItem("uid");

/* LOGOUT */
function logout(){
localStorage.clear();
window.location.href="login.html";
}

/* CREATE JOB */
async function createJob(){
const title=document.getElementById("title").value.trim();
const subject=document.getElementById("subject").value.trim();
const city=document.getElementById("city").value.trim();
const role=document.getElementById("role").value;
const salary=document.getElementById("salary").value.trim();
const description=document.getElementById("description").value.trim();

if(!title||!subject||!city){
alert("Title, Subject, City required");
return;
}

const res=await fetch(`${BASE_URL}/api/job/create`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({instituteUid:uid,title,subject,city,role,salary,description})
});

const data=await res.json();
document.getElementById("jobMsg").innerText=data.message||"Done";
loadJobs();
}

/* LOAD JOBS */
async function loadJobs(){
const res=await fetch(`${BASE_URL}/api/job/institute/${uid}`);
const data=await res.json();

const box=document.getElementById("jobsBox");
box.innerHTML="";

if(!data.success||!data.jobs.length){
box.innerHTML="No jobs yet.";
return;
}

data.jobs.forEach(j=>{
const div=document.createElement("div");
div.className="card";
div.style.margin="10px 0";

div.innerHTML=`
<b>${j.title}</b>
<span class="badge ${j.status==='open'?'open':'closed'}">${j.status}</span>
<br>${j.subject} • ${j.city} • ${j.role}
<br><br>
${j.status==="open"?
`<button class="btnDanger" onclick="closeJob('${j._id}')">Close</button>`
:""}
`;

box.appendChild(div);
});
}

/* CLOSE JOB */
async function closeJob(id){
await fetch(`${BASE_URL}/api/job/close/${id}`,{method:"POST"});
loadJobs();
}

/* LOAD TEACHERS */
async function loadTeachers(){
const res=await fetch(`${BASE_URL}/api/teachers`);
const data=await res.json();

const box=document.getElementById("teachersBox");
box.innerHTML="";

if(!data.teachers.length){
box.innerHTML="No teachers found.";
return;
}

data.teachers.forEach(t=>{
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<b>${t.name}</b> - ${t.subject} (${t.city})
<br><br>
<button onclick="sendInvite('${t.uid}')">Send Invite</button>
`;

box.appendChild(div);
});
}

/* SEND INVITE */
async function sendInvite(teacherUid){
const res=await fetch(`${BASE_URL}/api/invite/create`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
fromType:"institute",
fromUid:uid,
toType:"teacher",
toUid:teacherUid
})
});
const data=await res.json();
alert(data.message||"Invite sent");
}

/* LOAD APPLICATIONS */
async function loadApplications(){
const res=await fetch(`${BASE_URL}/api/job-application/institute/${uid}`);
const data=await res.json();

const box=document.getElementById("applicationsBox");
box.innerHTML="";

if(!data.success||!data.applications.length){
box.innerHTML="No applications yet.";
return;
}

data.applications.forEach(app=>{
const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<b>Teacher:</b> ${app.teacher?.name||app.teacherUid}
<br><b>Job:</b> ${app.jobId?.title||"-"}
<br><b>Status:</b> ${app.status}
<br><br>
${app.status==="applied"?
`
<button onclick="updateStatus('${app._id}','shortlisted')">Shortlist</button>
<button class="btnDanger" onclick="updateStatus('${app._id}','rejected')">Reject</button>
`
:""}
`;

box.appendChild(div);
});
}

/* UPDATE STATUS */
async function updateStatus(applicationId,status){
const res=await fetch(`${BASE_URL}/api/job-application/update-status`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({applicationId,status})
});
const data=await res.json();
alert(data.message||"Updated");
loadApplications();
}

/* INIT */
loadJobs();

</script>
</body>
</html>
