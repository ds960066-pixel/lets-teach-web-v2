<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teaching Jobs | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="./config.js"></script>
</head>

<body>

  <!-- NAV -->
  <div class="nav">
    <div class="container navInner">
      <a class="brand" href="index.html">
        <div class="logo"></div>
        <div>Lets Teach</div>
      </a>

      <div class="navLinks">
        <a class="pill" href="index.html">Home</a>
        <a class="pill" href="interview/index.html">Interview Preps</a>
        <a class="pill" href="login.html">Login</a>
      </div>
    </div>
  </div>

  <div class="container">

    <!-- HERO -->
    <div class="hero">
      <div class="card cardPad">
        <h1 class="hTitle" style="font-size:34px;margin-bottom:8px;">Teaching Jobs</h1>
        <p class="hSub">Public job browsing. Apply karne ke liye teacher login required.</p>

        <div id="loginHint" class="kpi" style="display:none;">
          <b>Login Required</b>
          <span>Please login as a Teacher to apply for jobs.</span>
        </div>

        <hr class="sep" />

        <!-- FILTERS -->
        <div class="sectionTitle">Search Filters</div>
        <div class="searchGrid">
          <input class="input" id="city" placeholder="City (e.g. Delhi)" />
          <input class="input" id="subject" placeholder="Subject (e.g. Math)" />
          <select class="input" id="role">
            <option value="">Any Role</option>
            <option value="part-time">Part-time</option>
            <option value="full-time">Full-time</option>
          </select>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
          <button class="btn" onclick="loadJobs()">Search</button>
          <button class="btn ghost" onclick="clearFilters()">Clear</button>
        </div>
      </div>
    </div>

    <!-- RESULTS -->
    <div class="card cardPad">
      <div style="display:flex; justify-content:space-between;">
        <div class="sectionTitle">Open Jobs</div>
        <span id="jobCount" class="badge">0</span>
      </div>

      <hr class="sep" />
      <div id="jobs" class="list"></div>
    </div>

  </div>

<script>
/* AUTH */
const uid = localStorage.getItem("uid");
const role = localStorage.getItem("role");

if (!uid || role !== "teacher") {
  document.getElementById("loginHint").style.display = "block";
}

/* CLEAR FILTERS */
function clearFilters() {
  document.getElementById("city").value = "";
  document.getElementById("subject").value = "";
  document.getElementById("role").value = "";
  loadJobs();
}

/* LOAD JOBS (Public Route – normal fetch allowed) */
async function loadJobs() {
  try {
    const res = await fetch(`${BASE_URL}/api/job/browse`);
    const data = await res.json();

    const list = data.jobs || [];
    document.getElementById("jobCount").innerText = list.length;

    const box = document.getElementById("jobs");
    box.innerHTML = "";

    if (!list.length) {
      box.innerHTML = "<div class='meta'>No jobs found</div>";
      return;
    }

    list.forEach(j => {
      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        <div>
          <div style="font-weight:800">${j.title}</div>
          <div class="meta">${j.subject} · ${j.city} · ${j.role}</div>
          <div style="margin-top:8px">
            <button class="btn" onclick="applyJob('${j._id}')">Apply</button>
          </div>
        </div>
        <span class="badge">Open</span>
      `;

      box.appendChild(div);
    });

  } catch (err) {
    document.getElementById("jobs").innerHTML = "Server error";
  }
}

/* APPLY JOB (Protected Route – MUST use apiFetch) */
async function applyJob(jobId) {
  if (!uid || role !== "teacher") {
    alert("Login as Teacher to apply");
    return;
  }

  try {
    const res = await apiFetch(`${BASE_URL}/api/job-application/apply`, {
      method: "POST",
      body: JSON.stringify({ jobId })
    });

    if (!res) return;

    const data = await res.json();
    alert(data.message || "Applied successfully");

  } catch (err) {
    alert("Server error");
  }
}

loadJobs();
</script>


</body>
</html>
