<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Chat | Lets Teach</title>

  <link
    rel="stylesheet"
    href="styles.css"
  />

  <script src="./config.js"></script>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>


  <style>

    body {
      background: #101a2b;
      font-family: Arial;
    }


    .chatBox {

      height: 420px;

      overflow-y: auto;

      padding: 12px;

      border: 1px solid #333;

      margin-bottom: 10px;

      display: flex;

      flex-direction: column;

      gap: 8px;

      background: #0f1a33;

    }


    .bubble {

      max-width: 75%;

      padding: 8px 12px;

      border-radius: 12px;

      color: #fff;

      word-break: break-word;

    }


    .me {

      align-self: flex-end;

      background: #2ecc71;

    }


    .other {

      align-self: flex-start;

      background: #34495e;

    }


    input {

      padding: 8px;

      width: 80%;

      box-sizing: border-box;

    }


    button {

      padding: 8px 12px;

      cursor: pointer;

    }

  </style>

</head>


<body>


<h2 style="color:white">
  Chat
</h2>


<div
  id="chatBox"
  class="chatBox"
></div>


<input
  id="message"
  placeholder="Type message..."
/>


<button
  onclick="sendMessage()"
>
  Send
</button>


<script>

/* =================================================
   AUTH
================================================= */

const token =
  localStorage.getItem("token");

const role =
  localStorage.getItem("role");


/* =================================================
   CURRENT USER UID

   IMPORTANT:
   Chat uses business UID.

   Teacher:
   T123456789

   Institute:
   I123456789
================================================= */

const senderUid =
  localStorage.getItem("uid");


/* =================================================
   AUTH CHECK
================================================= */

if (
  !token ||
  !role ||
  !senderUid
) {

  alert(
    "Session missing. Please login again."
  );

  window.location.href =
    "login.html";

}


/* =================================================
   RECEIVER UID
================================================= */

const qs =
  new URLSearchParams(
    location.search
  );


const receiverUid =
  qs.get("receiverUid");


if (!receiverUid) {

  alert(
    "Receiver missing"
  );

  window.location.href =
    "index.html";

}


/* =================================================
   ROOM ID
================================================= */

const roomId =
  String(senderUid) <
  String(receiverUid)

    ? String(senderUid) +
      "_" +
      String(receiverUid)

    : String(receiverUid) +
      "_" +
      String(senderUid);


/* =================================================
   SOCKET
================================================= */

const socket =
  io(BASE_URL);


socket.on(
  "connect",
  () => {

    console.log(
      "Socket connected:",
      socket.id
    );


    console.log(
      "Chat sender UID:",
      senderUid
    );


    console.log(
      "Chat receiver UID:",
      receiverUid
    );


    console.log(
      "Chat room:",
      roomId
    );


    socket.emit(
      "joinRoom",
      roomId
    );

  }
);


socket.on(
  "connect_error",
  err => {

    console.error(
      "Socket connection error:",
      err
    );

  }
);


/* =================================================
   LOAD OLD MESSAGES
================================================= */

async function loadChatHistory() {

  try {

    const res =
      await fetch(

        `${BASE_URL}/api/chat/${encodeURIComponent(
          senderUid
        )}/${encodeURIComponent(
          receiverUid
        )}`,

        {

          headers: {

            Authorization:
              `Bearer ${token}`

          }

        }

      );


    if (res.status === 401) {

      alert(
        "Session expired. Please login again."
      );

      localStorage.clear();

      window.location.href =
        "login.html";

      return;

    }


    if (res.status === 403) {

      console.error(
        "Chat history unauthorized"
      );

      return;

    }


    if (!res.ok) {

      console.error(
        "Chat history status:",
        res.status
      );

      return;

    }


    const data =
      await res.json();


    console.log(
      "CHAT HISTORY:",
      data
    );


    if (
      data.success &&
      data.messages
    ) {

      data.messages.forEach(
        m => {

          appendMessage(
            m.senderUid,
            m.text
          );

        }
      );

    }


  } catch (err) {

    console.error(
      "History load error:",
      err
    );

  }

}


/* =================================================
   APPEND MESSAGE
================================================= */

function appendMessage(
  fromUid,
  text
) {

  const box =
    document.getElementById(
      "chatBox"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "bubble " +
    (
      String(fromUid) ===
      String(senderUid)

        ? "me"

        : "other"
    );


  div.innerText =
    text;


  box.appendChild(
    div
  );


  box.scrollTop =
    box.scrollHeight;

}


/* =================================================
   SEND MESSAGE
================================================= */

function sendMessage() {

  const input =
    document.getElementById(
      "message"
    );


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  /* Show instantly */

  appendMessage(
    senderUid,
    text
  );


  /* Send through socket */

  socket.emit(
    "sendMessage",
    {

      senderUid,

      receiverUid,

      text,

      roomId

    }
  );


  input.value =
    "";

}


/* =================================================
   RECEIVE MESSAGE
================================================= */

socket.on(
  "receiveMessage",
  msg => {

    if (
      String(msg.senderUid) !==
      String(senderUid)
    ) {

      appendMessage(
        msg.senderUid,
        msg.text
      );

    }

  }
);


/* =================================================
   ENTER KEY
================================================= */

document
  .getElementById("message")
  .addEventListener(
    "keydown",
    e => {

      if (
        e.key === "Enter"
      ) {

        sendMessage();

      }

    }
  );


/* =================================================
   INIT
================================================= */

loadChatHistory();

</script>


</body>

</html>
