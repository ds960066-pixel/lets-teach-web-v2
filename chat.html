<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ Config (contains BASE_URL) -->
  <script src="./config.js"></script>

  <!-- ✅ Socket CDN (FIXED) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    body {
      background:#101a2b;
      font-family: Arial;
    }

    .chatBox {
      height:420px;
      overflow-y:auto;
      padding:12px;
      border:1px solid #333;
      margin-bottom:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      background:#0f1a33;
    }

    .bubble {
      max-width:75%;
      padding:8px 12px;
      border-radius:12px;
      color:#fff;
      word-break:break-word;
    }

    .me {
      align-self:flex-end;
      background:#2ecc71;
    }

    .other {
      align-self:flex-start;
      background:#34495e;
    }

    input {
      padding:8px;
      width:80%;
    }

    button {
      padding:8px 12px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<h2 style="color:white">Chat</h2>

<div id="chatBox" class="chatBox"></div>

<input id="message" placeholder="Type message..." />
<button onclick="sendMessage()">Send</button>

<script>
/* ================= AUTH ================= */
const senderUid = localStorage.getItem("uid");
const role = localStorage.getItem("role");

if (!senderUid || !role) {
  window.location.href = "login.html";
}

/* ================= RECEIVER ================= */
const qs = new URLSearchParams(location.search);
const receiverUid = qs.get("receiverUid");

if (!receiverUid) {
  alert("Receiver missing");
  window.location.href = "index.html";
}

/* ================= ROOM ID ================= */
const roomId =
  senderUid < receiverUid
    ? senderUid + "_" + receiverUid
    : receiverUid + "_" + senderUid;

/* ================= SOCKET ================= */
const socket = io(BASE_URL);

socket.on("connect", () => {
  socket.emit("joinRoom", roomId);
});

/* ================= LOAD OLD MESSAGES ================= */
async function loadChatHistory() {
  try {
    const res = await fetch(
      `${BASE_URL}/api/chat/${senderUid}/${receiverUid}`
    );

    const data = await res.json();

    if (data.success && data.messages) {
      data.messages.forEach(m => {
        appendMessage(m.senderUid, m.text);
      });
    }
  } catch (err) {
    console.error("History load error", err);
  }
}

/* ================= APPEND ================= */
function appendMessage(fromUid, text) {
  const box = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = "bubble " + (fromUid === senderUid ? "me" : "other");
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

/* ================= SEND ================= */
function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value.trim();
  if (!text) return;

  // show instantly
  appendMessage(senderUid, text);

  socket.emit("sendMessage", {
    senderUid,
    receiverUid,
    text,
    roomId
  });

  input.value = "";
}

/* ================= RECEIVE ================= */
socket.on("receiveMessage", (msg) => {
  if (msg.senderUid !== senderUid) {
    appendMessage(msg.senderUid, msg.text);
  }
});

/* ================= ENTER KEY ================= */
document.getElementById("message").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

/* ================= INIT ================= */
loadChatHistory();
</script>

</body>
</html>
