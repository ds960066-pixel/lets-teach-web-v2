<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ Correct config -->
  <script src="./config.js"></script>

  <!-- ✅ Correct Socket CDN -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    body{
      background: radial-gradient(1000px 600px at 10% -10%, rgba(59,130,246,.18), transparent 60%),
                  radial-gradient(900px 520px at 90% 0%, rgba(34,197,94,.14), transparent 60%),
                  #101a2b;
    }

    .chatBox{
      height:420px;
      overflow-y:auto;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .bubble{
      max-width:78%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid #1f2a44;
      background:#0f1a33;
      color:#fff;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .me{
      align-self:flex-end;
      background:#163d2f;
    }

    .other{
      align-self:flex-start;
      background:#1e293b;
    }

    .chatInputRow{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .chatInputRow input{
      flex:1;
      padding:10px;
      border-radius:8px;
      border:1px solid #2e86de;
      background:#0f172a;
      color:#fff;
    }

    button{
      padding:10px 14px;
      border-radius:8px;
      border:none;
      background:#2e86de;
      color:#fff;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div style="max-width:900px;margin:auto;padding:20px">

  <h2 style="color:white">Chat</h2>
  <div id="chatInfo" style="color:#aaa;margin-bottom:10px">Connecting...</div>

  <div id="chatBox" class="chatBox"></div>

  <div class="chatInputRow">
    <input id="message" placeholder="Type message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <div style="margin-top:10px">
    <button onclick="goBack()">Back</button>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<script>

/* ❌ DO NOT DECLARE BASE_URL HERE */
/* config.js already defines BASE_URL */

const senderUid = localStorage.getItem("uid");
const role = localStorage.getItem("role");

if (!senderUid || !role) {
  location.href = "login.html";
}

/* receiver */
const qs = new URLSearchParams(location.search);
const receiverUid = qs.get("receiverUid");

if (!receiverUid) {
  alert("Receiver missing");
  location.href = "index.html";
}

/* deterministic room */
const roomId = senderUid < receiverUid
  ? senderUid + "_" + receiverUid
  : receiverUid + "_" + senderUid;

document.getElementById("chatInfo").innerText =
  "You: " + senderUid + " | Chat with: " + receiverUid;

/* ================= SOCKET ================= */
const socket = io(BASE_URL);

socket.on("connect", () => {
  socket.emit("joinRoom", roomId);
});

socket.on("receiveMessage", (msg) => {
  if (msg.senderUid !== senderUid) {
    appendMessage(msg.senderUid, msg.text);
  }
});

/* ================= FUNCTIONS ================= */
function appendMessage(from, text) {
  const box = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = "bubble " + (from === senderUid ? "me" : "other");
  div.innerText = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value.trim();
  if (!text) return;

  appendMessage(senderUid, text);

  socket.emit("sendMessage", {
    senderUid,
    receiverUid,
    text,
    roomId
  });

  input.value = "";
}

document.getElementById("message").addEventListener("keydown", e=>{
  if(e.key==="Enter") sendMessage();
});

function goBack(){
  if(role==="teacher") location.href="teacher-dashboard.html";
  else location.href="institute-dashboard.html";
}

function logout(){
  localStorage.clear();
  location.href="login.html";
}

</script>

</body>
</html>
