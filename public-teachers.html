/* ===== SAFE TEXT ===== */
function esc(str) {
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ===== SEARCH ===== */
function search() {
  const city = document.getElementById("city").value.trim();
  const subject = document.getElementById("subject").value.trim();

  let url = `${BASE_URL}/api/teacher/browse`;
  const params = [];

  if (city) params.push(`city=${encodeURIComponent(city)}`);
  if (subject) params.push(`subject=${encodeURIComponent(subject)}`);

  if (params.length) url += `?${params.join("&")}`;

  const box = document.getElementById("results");
  box.innerHTML = "Loading teachers...";

  fetch(url)
    .then(res => res.json())
    .then(data => {
      box.innerHTML = "";

      if (!data || !Array.isArray(data.teachers) || data.teachers.length === 0) {
        box.innerHTML = "<p>No teachers found</p>";
        return;
      }

      data.teachers.forEach(t => {
        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
          <h3>${esc(t.name || "Teacher")}</h3>
          <p><b>Subject:</b> ${esc(t.subject || "—")}</p>
          <p><b>City:</b> ${esc(t.city || "—")}</p>
          <p><b>Experience:</b> ${Number(t.experience || 0)} yrs</p>

          <button onclick="alert('Login as institute to invite')">
            Invite Teacher
          </button>
        `;

        box.appendChild(div);
      });
    })
    .catch(() => {
      box.innerHTML = "<p>Server error. Please try again.</p>";
    });
}
</script>
