<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Jobs | Lets Teach</title>
  <script src="./config.js"></script>
</head>

<body style="font-family:Arial;padding:20px;background:#f4f4f4;">

<script>
if (!localStorage.uid || localStorage.role !== "institute") {
  window.location.href = "login.html";
}
</script>

<h2>📌 My Created Jobs</h2>
<button onclick="location.href='institute-dashboard.html'">← Back</button>
<hr>

<div id="box">Loading...</div>

<script>

const uid = localStorage.getItem("uid");

/* ================= LOAD JOBS ================= */
async function loadJobs() {
  try {

    // ✅ IMPORTANT — use apiFetch (not fetch)
    const res = await apiFetch(`${BASE_URL}/api/job/institute/${uid}`);

    if (!res) {
      document.getElementById("box").innerHTML = "Unauthorized";
      return;
    }

    const data = await res.json();
    const box = document.getElementById("box");
    box.innerHTML = "";

    if (!data.success || !data.jobs || data.jobs.length === 0) {
      box.innerHTML = "<p>No jobs created yet.</p>";
      return;
    }

    data.jobs.forEach(job => {
      const div = document.createElement("div");
      div.style.background = "#fff";
      div.style.padding = "12px";
      div.style.marginBottom = "12px";
      div.style.borderRadius = "6px";
      div.style.boxShadow = "0 2px 6px rgba(0,0,0,0.1)";

      div.innerHTML = `
        <b>Title:</b> ${job.title} <br>
        <b>City:</b> ${job.city} <br>
        <b>Subject:</b> ${job.subject} <br>
        <b>Status:</b> ${job.status} <br>
        <b>Salary:</b> ${job.salary} <br>
      `;

      box.appendChild(div);
    });

  } catch (err) {
    document.getElementById("box").innerHTML = "Server error";
  }
}

loadJobs();

</script>

</body>
</html>
