<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Realtime Chat | Lets Teach</title>

  <script src="/lets-teach-web-v2/config.js"></script>"/lets-teach-web-v2/config.js"></script>
  <script src="/lets-teach-web-v2/config.js"></script>"https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    h2 { margin-top: 0; }

    #chat {
      background: #fff;
      border: 1px solid #ddd;
      height: 320px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .me {
      text-align: right;
      color: #1e7e34;
      margin: 6px 0;
      font-weight: 600;
    }
    .other {
      text-align: left;
      color: #1b4f72;
      margin: 6px 0;
      font-weight: 600;
    }
    input {
      width: calc(100% - 90px);
      padding: 8px;
    }
    button {
      padding: 8px 14px;
      margin-left: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<script>
/* ========= AUTH GUARD ========= */
const myUid = localStorage.getItem("uid");
const myRole = localStorage.getItem("role");

if (!myUid) {
  window.location.href = "login.html";
}
</script>

<h2>Realtime Chat</h2>

<div id="chat"></div>

<input id="msg" placeholder="Type message…" />
<button onclick="send()">Send</button>

<script>
/* ========= PARAMS ========= */
const params = new URLSearchParams(window.location.search);
const receiverUid = params.get("receiverUid");

if (!receiverUid) {
  alert("receiverUid missing");
}

/* ========= ROOM ID (STABLE) ========= */
function buildRoomId(a, b) {
  return [a, b].sort().join("_");
}

const roomId = buildRoomId(myUid, receiverUid);

/* ========= SOCKET ========= */
const socket = io(BASE_URL, {
  transports: ["websocket"]
});

socket.on("connect", () => {
  console.log("Socket connected");
  socket.emit("joinRoom", roomId);
});

socket.on("receiveMessage", data => {
  const div = document.createElement("div");
  div.className = data.senderUid === myUid ? "me" : "other";
  div.innerText = `${data.senderUid}: ${data.text}`;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 999999;
});

/* ========= SEND ========= */
function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  socket.emit("sendMessage", {
    roomId,
    senderUid: myUid,
    receiverUid,
    text
  });

  input.value = "";
}
</script>

</body>
</html>
