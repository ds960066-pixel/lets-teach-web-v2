<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Realtime Chat Test | Lets Teach</title>

  <script src="/lets-teach-web-v2/config.js"></script>"https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; background:#f5f5f5; }
    .card{background:#fff;border-radius:8px;padding:14px;max-width:820px;margin:auto;}
    #chat {
      border: 1px solid #ddd;
      height: 320px;
      overflow-y: auto;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      background:#fafafa;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .me {
      align-self:flex-end;
      background:#dcf8c6;
      padding:8px 10px;
      border-radius:10px;
      max-width:75%;
    }
    .other {
      align-self:flex-start;
      background:#e9ecef;
      padding:8px 10px;
      border-radius:10px;
      max-width:75%;
    }
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input{padding:10px;border:1px solid #ddd;border-radius:8px;min-width:240px}
    button{padding:10px 14px;border:0;border-radius:8px;background:#2e86de;color:#fff;cursor:pointer}
  </style>
</head>

<body>
  <div class="card">
    <h2>Realtime Chat Test</h2>
    <small id="info">Loading...</small>

    <div id="chat"></div>

    <div class="row">
      <input id="msg" placeholder="Type message" />
      <button onclick="send()">Send</button>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);

  const roomId = params.get("roomId") || "room1";
  const me = params.get("me") || "user1";
  const other = params.get("other") || "user2";

  const serverMode = (params.get("server") || "prod").toLowerCase();
  const SOCKET_URL =
    serverMode === "local"
      ? "http://localhost:5000"
      : "https://express-hello-world-uh96.onrender.com";

  document.getElementById("info").innerText =
    `Server: ${SOCKET_URL} | Room: ${roomId} | Me: ${me}`;

  const socket = io(SOCKET_URL);

  socket.on("connect", () => {
    socket.emit("joinRoom", roomId);
  });

  /* ✅ RECEIVE MESSAGE (ONLY ONE SOURCE OF TRUTH) */
  socket.on("receiveMessage", (data) => {
    const div = document.createElement("div");
    div.className = (data.senderUid === me) ? "me" : "other";
    div.innerText = `${data.senderUid}: ${data.text}`;

    const chat = document.getElementById("chat");
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  });

  /* ✅ SEND MESSAGE (NO SELF APPEND) */
  function send() {
    const input = document.getElementById("msg");
    const text = input.value.trim();
    if (!text) return;

    socket.emit("sendMessage", {
      senderUid: me,
      receiverUid: other,
      text,
      roomId
    });

    input.value = "";
    input.focus();
  }

  document.getElementById("msg").addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });
</script>

</body>
</html>
