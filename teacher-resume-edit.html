<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Resume | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />
  <script src="./config.js"></script>
</head>

<body>

<!-- AUTH GUARD -->
<script>
  const token = localStorage.getItem("token");
  const uid = localStorage.getItem("uid");
  const role = localStorage.getItem("role");

  if (!token || !uid || role !== "teacher") {
    window.location.href = "login.html";
  }
</script>

<!-- NAV -->
<div class="nav">
  <div class="container navInner">
    <div class="brand">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </div>

    <div class="navLinks">
      <a class="pill" href="teacher-dashboard.html">Dashboard</a>
      <a class="pill" href="teacher-resume-view.html">View Resume</a>
      <a class="pill" href="jobs.html">Jobs</a>
    </div>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1 class="hTitle">Build your resume</h1>
    <p class="hSub">
      Resume complete hona mandatory hai job apply ke liye.
    </p>
  </div>

  <div class="card cardPad">

    <div class="sectionTitle">About you</div>
    <textarea class="input" id="about" rows="5"
      placeholder="Short professional summary..."></textarea>

    <hr class="sep">

    <div class="sectionTitle">Education</div>
    <input class="input" id="education"
      placeholder="B.Ed, M.Sc Mathematics, etc" />

    <hr class="sep">

    <div class="sectionTitle">Skills</div>
    <input class="input" id="skills"
      placeholder="Maths, Physics, Online Teaching (comma separated)" />

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;">
      <button class="btn" type="button" onclick="saveResume()">Save Resume</button>
      <a class="pill" href="teacher-dashboard.html">Back</a>
    </div>

    <div id="msg" class="meta" style="margin-top:12px;"></div>

  </div>

  <div class="footer">
    <span class="meta">Lets Teach · Teacher Resume</span>
  </div>

</div>

<script>

/* ================= COMMON API FETCH (JWT SAFE) ================= */
async function apiFetch(url, options = {}) {
  options.headers = {
    ...(options.headers || {}),
    "Authorization": "Bearer " + token
  };

  try {
    const res = await fetch(url, options);

    if (res.status === 401) {
      alert("Session expired. Please login again.");
      localStorage.clear();
      window.location.href = "login.html";
      return null;
    }

    return res;
  } catch (err) {
    return null;
  }
}

/* ================= LOAD EXISTING DATA ================= */
(async function loadExisting() {
  try {
    const res = await apiFetch(`${BASE_URL}/api/teacher/${uid}`);
    if (!res) return;

    const data = await res.json();

    if (!data.teacher) return;

    const t = data.teacher;
    document.getElementById("about").value = t.about || "";
    document.getElementById("education").value = t.education || "";
    document.getElementById("skills").value =
      Array.isArray(t.skills) ? t.skills.join(", ") : "";
  } catch {
    document.getElementById("msg").innerText =
      "Could not load existing resume.";
  }
})();

/* ================= SAVE RESUME ================= */
async function saveResume() {
  const about = document.getElementById("about").value.trim();
  const education = document.getElementById("education").value.trim();
  const skillsRaw = document.getElementById("skills").value.trim();

  if (!about || !education || !skillsRaw) {
    alert("All fields are required");
    return;
  }

  const skills = skillsRaw
    .split(",")
    .map(s => s.trim())
    .filter(Boolean);

  document.getElementById("msg").innerText = "Saving...";

  try {
    const res = await apiFetch(
      `${BASE_URL}/api/teacher/resume/${uid}`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ about, education, skills })
      }
    );

    if (!res) return;

    const data = await res.json();

    if (data.success) {
      document.getElementById("msg").innerText =
        "✅ Resume saved successfully. Now you can apply for jobs.";
    } else {
      document.getElementById("msg").innerText =
        data.message || "Failed to save resume";
    }
  } catch (err) {
    document.getElementById("msg").innerText = "Server error";
  }
}

</script>

</body>
</html>
