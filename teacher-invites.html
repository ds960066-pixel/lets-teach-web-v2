<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Invites | Lets Teach</title>

  <link rel="stylesheet" href="styles.css" />

  <!-- 🔒 SINGLE SOURCE OF TRUTH -->
  <script src="/lets-teach-web-v2/config.js"></script>"/lets-teach-web-v2/config.js"></script>
</head>

<body>

<!-- AUTH GUARD -->
<script>
  if (!localStorage.uid || localStorage.role !== "teacher") {
    window.location.href = "login.html";
  }
</script>

<!-- NAV -->
<div class="nav">
  <div class="container navInner">
    <div class="brand">
      <div class="logo"></div>
      <div>Lets Teach</div>
    </div>

    <div class="navLinks">
      <a class="pill" href="teacher-dashboard.html">Dashboard</a>
      <a class="pill" href="jobs.html">Jobs</a>
      <a class="pill" href="login.html">Logout</a>
    </div>
  </div>
</div>

<div class="container">

  <div class="hero">
    <h1 class="hTitle">My Invites</h1>
    <p class="hSub">
      Institutes se aaye huye invites. Accept hone ke baad chat unlock hota hai.
    </p>
  </div>

  <div class="card cardPad">
    <div class="sectionTitle">Invites</div>
    <hr class="sep" />

    <ul id="inviteList" class="list"></ul>
    <div id="hint" class="meta" style="margin-top:12px;"></div>
  </div>

  <div class="footer">
    <span class="meta">Lets Teach · Teacher Invites</span>
  </div>

</div>

<script>
const teacherUid = localStorage.getItem("uid");

function setHint(msg) {
  document.getElementById("hint").innerHTML = msg || "";
}

/* ================= LOAD INVITES ================= */
function loadInvites() {
  const list = document.getElementById("inviteList");
  list.innerHTML = `<div class="meta">Loading invites...</div>`;
  setHint("");

  fetch(`${BASE_URL}/api/invite/teacher/${encodeURIComponent(teacherUid)}`)
    .then(res => res.json())
    .then(data => {
      list.innerHTML = "";

      if (!data.invites || data.invites.length === 0) {
        list.innerHTML = `<div class="meta">No invites yet</div>`;
        return;
      }

      data.invites.forEach(invite => {
        const div = document.createElement("div");
        div.className = "item";

        let actions = "";
        if (invite.status === "pending") {
          actions = `
            <button class="btn" onclick="acceptInvite('${invite._id}')">Accept</button>
            <button class="pill" onclick="rejectInvite('${invite._id}')">Reject</button>
          `;
        } else if (invite.status === "accepted") {
          actions = `<span class="badge">Accepted</span>`;
        } else {
          actions = `<span class="badge">${invite.status}</span>`;
        }

        div.innerHTML = `
          <div style="flex:1;">
            <div style="font-weight:700;">From Institute</div>
            <div class="meta">${invite.fromUid}</div>
            <div class="meta" style="margin-top:4px;">
              Status: <b>${invite.status}</b>
            </div>
            <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;">
              ${actions}
            </div>
          </div>
          <div class="badge">Invite</div>
        `;

        list.appendChild(div);
      });
    })
    .catch(() => {
      list.innerHTML = `<div class="meta">Server error loading invites</div>`;
    });
}

/* ================= ACTIONS ================= */
function acceptInvite(id) {
  fetch(`${BASE_URL}/api/invite/accept/${id}`, { method: "POST" })
    .then(() => {
      alert("Invite accepted");
      loadInvites();
    });
}

function rejectInvite(id) {
  fetch(`${BASE_URL}/api/invite/reject/${id}`, { method: "POST" })
    .then(() => {
      alert("Invite rejected");
      loadInvites();
    });
}

/* INIT */
loadInvites();
</script>

</body>
</html>
